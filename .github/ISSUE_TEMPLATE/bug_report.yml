name: 缺陷报告
description: 提交可复现的 CBM Sec 问题，不粘贴业务源码或秘密。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请提供最小脱敏样例；涉及本工具未修复漏洞时，先按 SECURITY.md 寻求私密渠道。
  - type: input
    id: version
    attributes:
      label: 提交、程序版本和构建编号
      description: 提供 cbm-security-facts --version 和 --capabilities 的相关结果。
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 系统、架构和编译方式
      description: 说明使用源码构建、历史 Release 还是本地候选；不要混用版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现与预期/实际结果
      description: 给出工具名、脱敏参数、源码片段和停止/未知状态。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已检查的证据
      description: 说明文件范围、对应调用现场、测试命令及结果；不要上传完整私有源码包。
