name: 功能建议
description: 说明具体审计问题，以及缺少哪种程序关系或上下文。
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的审计问题
      description: 说明处于侦查、假设生成还是验证阶段，当前工具在哪里停止。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 语言、框架与最小样例
      description: 给出脱敏正反例、预期证据和必须保留的未知项，不只增加一个标签名称。
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: 怎样验证有用且正确
      description: 说明可比较的框架行为、反例或真实任务指标。
